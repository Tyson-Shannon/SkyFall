[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skyfall-ai"
version = "0.1.0"
description = "Anomaly-detection sidecar for the SkyFall system monitor"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["skyfall_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]