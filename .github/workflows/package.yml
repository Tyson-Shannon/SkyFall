name: Package SkyFall

# Builds the bundled desktop app for Windows and Linux and attaches the
# installers/binaries to a GitHub Release when a v* tag is pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc => widest Linux compatibility
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            label: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            label: windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # sidecar requires >=3.11; PyInstaller supports 3.11

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/sidecar/requirements.txt
          # Optional `ml` extra from pyproject.toml is frozen in too, so the
          # IsolationForest detector works in the packaged app as well.
          python -m pip install "scikit-learn>=1.3" pyinstaller

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Use images/SkyFall Logo.ico as the bundle icon
        shell: bash
        run: cp "images/SkyFall Logo.ico" crates/app/icons/icon.ico

      - name: Freeze Python sidecar (numpy + scikit-learn included)
        shell: bash
        run: >-
          python python/sidecar/freeze.py
          --target "${{ matrix.target }}"
          --out-dir crates/app/binaries

      - name: Build Tauri installers
        shell: bash
        working-directory: crates/app
        run: >-
          cargo tauri build
          --target "${{ matrix.target }}"
          --bundles "${{ matrix.bundles }}"
          --config ../../.github/tauri.release.conf.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skyfall-${{ matrix.label }}
          path: |
            target/${{ matrix.target }}/release/skyfall-desktop
            target/${{ matrix.target }}/release/skyfall-desktop.exe
            target/${{ matrix.target }}/release/skyfall-ai
            target/${{ matrix.target }}/release/skyfall-ai.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: skyfall-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
