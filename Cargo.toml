[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
rusqlite = "0.32"
toml = "0.8"
nvml-wrapper = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
# TLS is opt-in via the core `tls` feature: rustls pulls in `ring`, which needs a
# C compiler for the *target*. Keeping it out of the default feature set means a
# plain-HTTP build (the local-Ollama default) cross-compiles with no C toolchain.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
env_logger = "0.11"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
windows = { version = "0.58", features = [
    "Win32_System_Performance",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
] }